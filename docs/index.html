  "notifications": {
    "platform": "none",
    "local": true
  }
}`;

    // 章节标题组件。
    function SectionTitle({ id, title }) {
      return <Title level={2} id={id} style={{ marginTop: 48, scrollMarginTop: 88 }}>{title}</Title>;
    }

    function CodeBlock({ code }) {
      return <pre className="doc-code"><code>{code}</code></pre>;
    }

    function Figure({ src, alt, puml }) {
      return (
        <Card className="figure-card" variant="outlined">
          <img src={src} alt={alt} />
          <div style={{ marginTop: 12, color: "rgba(255,255,255,0.55)", fontSize: 13 }}>
            图表源码：<Link href={puml} target="_blank">{puml.split("/").pop()}</Link> · PNG：<Link href={src} target="_blank">{src.split("/").pop()}</Link>
          </div>
        </Card>
      );
    }

    function App() {
      return (
        <Layout style={{ minHeight: "100vh" }}>
          <Header style={{ display: "flex", alignItems: "center", gap: 12, position: "sticky", top: 0, zIndex: 10 }}>
            <Title level={4} style={{ margin: 0, color: "#22d3ee", letterSpacing: 1 }}>MITRERedTeam</Title>
            <Space style={{ marginLeft: "auto" }}>
              <Tag color="cyan">作者：{AUTHOR}</Tag>
              <Tag color="geekblue"><Link href={LICENSE_URL} target="_blank" style={{ color: "inherit" }}>{LICENSE}</Link></Tag>
            </Space>
          </Header>
          <Layout>
            <Sider width={220} theme="light" breakpoint="lg" collapsedWidth={0} style={{ background: "transparent" }}>
              <div style={{ position: "sticky", top: 88, padding: "24px 16px" }}>
                <Anchor items={anchors} targetOffset={88} />
              </div>
            </Sider>
            <Content style={{ padding: "0 40px 80px", maxWidth: 1080 }}>
              <Title style={{ marginTop: 32 }}>MITRERedTeam 开发文档</Title>
              <Paragraph type="secondary">
                基于 MITRE ATT&CK 的授权红队评估 CLI 工具 · 作者：{AUTHOR} · 许可证：<Link href={LICENSE_URL} target="_blank">{LICENSE}</Link>
              </Paragraph>

              <SectionTitle id="overview" title="项目概述" />
              <Paragraph>
                MITRERedTeam 是一个用 Go 写的授权红队 / 漏洞赏金命令行工具。评估流程按
                <Text strong>战术（Tactic）</Text>和<Text strong>技术（Technique）</Text>两级组织，编号是自研的
                <Text code>BBxx</Text> / <Text code>BBxx.xxx</Text>。执行什么、怎么执行都由你说了算——只跑你显式指定的那条
                技术或那个战术，不会自作主张把清单里的东西全跑一遍，也不会超出你声明的目标范围。
              </Paragraph>
              <Paragraph>
                战术和技术的清单放在 <Text code>catalog/*.json</Text>，纯数据驱动。MITRE ATT&amp;CK ID 只用来对齐行业标准，
                不算主标识符。
              </Paragraph>
              <Table columns={featureColumns} dataSource={featureData} pagination={false} size="middle" />

              <SectionTitle id="architecture" title="系统架构" />
              <Paragraph>
                这套架构叫<Text strong>CDRPA</Text>（目录驱动的注册式插件架构），拼了五种套路：目录驱动、注册模式、插件架构、
                分层架构、依赖倒置。核心系统不碰具体工具和具体技术实现，只认抽象。加新技术、接新工具的时候，尽量不动核心执行引擎。
              </Paragraph>
              <Figure src="assets/flow.png" alt="MITRERedTeam 系统架构与数据流" puml="assets/flow.puml" />

              <SectionTitle id="sequence" title="执行时序" />
              <Paragraph>下面是一次目录枚举技术（BB05.001）从 CLI 触发到外部工具执行、结果回传的时序。</Paragraph>
              <Figure src="assets/sequence.png" alt="MITRERedTeam 技术执行时序" puml="assets/sequence.puml" />

              <SectionTitle id="tactics" title="支持的战术" />
              <Table columns={tacticColumns} dataSource={tacticData} pagination={false} size="middle" />

              <SectionTitle id="techniques" title="支持的技术" />
              <Paragraph><Text code>catalog/techniques.json</Text> 当前收录 27 条技术。已实现状态指对应 Go 执行器是否已在 <Text code>internal/technique/</Text> 注册。</Paragraph>
              <Table columns={techniqueColumns} dataSource={techniqueData} pagination={false} size="middle" scroll={{ x: 760 }} />
              <Paragraph type="secondary">执行到还没实现的技术时，引擎会跳过并把话说清楚，不会假装成功。</Paragraph>

              <SectionTitle id="tools" title="工具集成" />
              <Paragraph>外部工具统一走 <Text code>tools/</Text> 适配层：路径解析、参数构造、context 超时、stdout/stderr 和退出码都在这一层处理。技术实现里不允许直接 <Text code>exec.Command</Text>。</Paragraph>
              <Table columns={toolColumns} dataSource={toolData} pagination={false} size="middle" />

              <SectionTitle id="modes" title="执行模式" />
              <Table columns={modeColumns} dataSource={modeData} pagination={false} size="middle" />

              <SectionTitle id="ai" title="AI 辅助执行" />
              <Paragraph><Text code>--ai</Text> 打开 AI 辅助模式：先执行你指定的初始技术，把输出交给 LLM 分析，LLM 再从目录里挑一条建议的技术继续推进，最多跑 3 轮。前提是 <Text code>.env</Text> 里至少配了一家供应商的 API Key。</Paragraph>
              <Table columns={aiColumns} dataSource={aiData} pagination={false} size="middle" />

              <SectionTitle id="notify" title="通知系统" />
              <Table columns={notifyColumns} dataSource={notifyData} pagination={false} size="middle" />

              <SectionTitle id="logging" title="日志系统" />
              <Paragraph>日志统一走结构化格式，一行里带上 RFC3339 时间戳、级别、操作名和描述，打到 stderr：</Paragraph>
              <CodeBlock code={logBlock} />

              <SectionTitle id="structure" title="项目结构" />
              <CodeBlock code={structureBlock} />

              <SectionTitle id="build" title="编译与运行" />
              <Title level={4}>前置条件</Title>
              <ul>
                <li>Go 1.26 或更高版本</li>
                <li>按需安装外部工具（ffuf、nmap、nuclei、httpx、subfinder、sqlmap）</li>
              </ul>
              <Title level={4}>直接运行</Title>
              <CodeBlock code={runBlock} />
              <Title level={4}>Make 构建</Title>
              <CodeBlock code={makeBlock} />

              <SectionTitle id="cli" title="CLI 用法" />
              <Table columns={cliColumns} dataSource={cliData} pagination={false} size="middle" />
              <Paragraph><Text code>--technique</Text>、<Text code>--tactic</Text>、<Text code>--mitre</Text> 三选一。</Paragraph>

              <SectionTitle id="quickstart" title="快速上手" />
              <CodeBlock code={runBlock} />
              <Title level={4}>AI 辅助执行</Title>
              <CodeBlock code={aiBlock} />

              <SectionTitle id="config" title="配置说明" />
              <CodeBlock code={configBlock} />

              <SectionTitle id="extend" title="扩展指南" />
              <Title level={4}>新增一条技术</Title>
              <ol>
                <li>在 <Text code>catalog/techniques.json</Text> 添加条目，声明 <Text code>executor</Text>、<Text code>mode</Text>、<Text code>tools</Text> 与 <Text code>mitre</Text>。</li>
                <li>在 <Text code>internal/technique/</Text> 对应领域子目录实现执行器，经注册表注册。</li>
                <li>技术实现经 <Text code>tools/</Text> 适配层调用外部工具。</li>
              </ol>
              <Title level={4}>新增一个工具适配器</Title>
              <Paragraph>按 <Text code>tools/README.md</Text> 五步指南：新建目录、嵌入 <Text code>tools.Adapter</Text> 基座、实现业务方法、声明配置、补测试。</Paragraph>

              <SectionTitle id="security" title="安全最佳实践" />
              <ul>
                <li>仅在<Text strong>授权范围</Text>内使用，执行必须由用户显式选择。</li>
                <li>外部命令一律 <Text code>exec.CommandContext</Text>，参数切片传递，不做 shell 解释。</li>
                <li>所有外部调用带 context 超时，输出按行数上限约束。</li>
                <li>外部输入先校验长度与格式再进入业务逻辑。</li>
                <li>凭据与 API Key 只存内存，不回显、不落盘、不写日志。</li>
              </ul>

              <SectionTitle id="implementation" title="技术实现细节" />
              <ul>
                <li><Text strong>CDRPA 架构</Text>：目录驱动 + 注册模式 + 插件架构 + 分层 + 依赖倒置。</li>
                <li><Text strong>索引化查询</Text>：目录加载阶段建立 ID 索引，查询为 O(1)。</li>
                <li><Text strong>工具适配基座</Text>：<Text code>tools.Adapter</Text> 统一执行器与默认超时兜底。</li>
                <li><Text strong>流式加载</Text>：catalog JSON 用 <Text code>json.Decoder</Text> 流式消费。</li>
                <li><Text strong>非交互检测</Text>：检测 stdin 是否为终端字符设备。</li>
                <li><Text strong>内存约束</Text>：RSS 上限 500MB，监控协程定期采样。</li>
              </ul>

              <SectionTitle id="dependencies" title="依赖项" />
              <Table columns={depColumns} dataSource={depData} pagination={false} size="middle" />

              <SectionTitle id="license" title="许可证" />
              <Paragraph>
                本项目采用 <Link href={LICENSE_URL} target="_blank">GPLv3</Link> 许可证，作者：{AUTHOR}。
              </Paragraph>
              <Divider />
              <Paragraph type="secondary" style={{ textAlign: "center" }}>
                MITRERedTeam · 作者 {AUTHOR} · 许可证 {LICENSE}
              </Paragraph>
            </Content>
          </Layout>
        </Layout>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(
      <ConfigProvider
        theme={{
          algorithm: theme.darkAlgorithm,
          token: {
            colorPrimary: "#22d3ee",
            borderRadius: 8,
            colorBgLayout: "#0b0f1a",
            colorBgContainer: "#131a2b",
            colorBorder: "#2a3550",
          },
        }}
      >
        <App />
      </ConfigProvider>
    );
  </script>
</body>
</html>
